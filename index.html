<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Stretchy</title>
<meta name="description" content="Grab his cheeks and pull. Two fingers stretch both sides.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Nunito:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root { --ink:#3B2E24; --ink-soft:#6E5B4A; --accent:#E2673D; --cream:#FFF8EF; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { width:100%; height:100%; overflow:hidden; color:var(--ink); font-family:Nunito, system-ui, sans-serif;
    /* matches the painted wall behind him, so stretched skin blends straight into the page */
    background:linear-gradient(180deg, #c9b8a4 0%, #c3b09b 50%, #bba893 100%);
    -webkit-user-select:none; user-select:none; -webkit-tap-highlight-color:transparent; overscroll-behavior:none;
    -webkit-touch-callout:none; }
  canvas { position:fixed; inset:0; width:100%; height:100%; display:block; touch-action:none; }
  canvas.grab { cursor:grab; } canvas.grabbing { cursor:grabbing; }

  .top { position:fixed; top:0; left:0; right:0; display:flex; justify-content:space-between; align-items:center;
    padding:max(16px, env(safe-area-inset-top), var(--sat, 0px)) 18px 0; pointer-events:none; z-index:3; gap:10px; }
  .brand { font-family:"Baloo 2", sans-serif; font-weight:800; font-size:26px; letter-spacing:-.01em; }
  .brand span { color:var(--accent); }
  .left { display:flex; align-items:center; gap:12px; }
  .picker { pointer-events:auto; display:flex; gap:6px; background:var(--cream); padding:4px; border-radius:999px; box-shadow:0 8px 22px rgba(80,50,25,.18); }
  .picker a { display:block; width:34px; height:34px; border-radius:50%; overflow:hidden; opacity:.55; transition:opacity .2s, transform .2s; outline:2px solid transparent; outline-offset:1px; }
  .picker a:hover { opacity:.9; transform:scale(1.06); }
  .picker a[aria-current="page"] { opacity:1; outline-color:var(--accent); }
  .picker img { width:100%; height:100%; object-fit:cover; display:block; }
  .right { display:flex; gap:8px; align-items:center; }
  .chip, .btn { pointer-events:auto; background:var(--cream); border-radius:999px; box-shadow:0 8px 22px rgba(80,50,25,.18);
    font-weight:700; font-size:13px; color:var(--ink); border:none; }
  .chip { padding:8px 14px; display:flex; gap:10px; align-items:baseline; white-space:nowrap; }
  .chip b { font-family:"Baloo 2", sans-serif; font-size:18px; color:var(--accent); line-height:1; }
  .chip small { color:var(--ink-soft); font-weight:700; }
  .btn { height:38px; padding:0 14px; cursor:pointer; display:flex; align-items:center; gap:6px; white-space:nowrap; }
  .btn[aria-pressed="true"] { background:var(--ink); color:var(--cream); }
  .btn.icon { width:38px; padding:0; justify-content:center; }
  .btn[hidden] { display:none; }
  .btn svg { width:18px; height:18px; }

  .hint { position:fixed; left:50%; bottom:max(22px, env(safe-area-inset-bottom), calc(var(--sab, 0px) + 12px)); transform:translateX(-50%); z-index:3;
    background:rgba(59,46,36,.86); color:var(--cream); padding:12px 20px; border-radius:999px; font-weight:700; font-size:15px;
    white-space:nowrap; pointer-events:none; transition:opacity .6s ease, transform .6s ease; backdrop-filter:blur(6px); }
  .hint.hide { opacity:0; transform:translate(-50%, 12px); }

  /* fingertip markers while stretching */
  .tip { position:fixed; width:46px; height:46px; margin:-23px 0 0 -23px; border-radius:50%; pointer-events:none; z-index:2;
    background:radial-gradient(circle, rgba(255,248,239,.55) 0%, rgba(255,248,239,.15) 60%, rgba(255,248,239,0) 70%);
    border:2px solid rgba(255,248,239,.85); opacity:0; transform:scale(.6); transition:opacity .15s, transform .15s; }
  .tip.on { opacity:1; transform:scale(1); }
  .tip.ghost { border-style:dashed; opacity:0; }
  .tip.ghost.on { opacity:.7; }

  /* comic "SLAP!" popups */
  .pow { position:fixed; z-index:4; pointer-events:none; font-family:"Baloo 2", sans-serif; font-weight:800; font-size:44px;
    color:#FFF3E0; -webkit-text-stroke:3px #3B2E24; paint-order:stroke fill; text-shadow:0 5px 0 #E2673D;
    transform:translate(-50%, -50%) rotate(var(--r)) scale(.3); opacity:0; animation:pow .75s cubic-bezier(.2,1.6,.4,1) forwards; }
  @keyframes pow {
    0% { opacity:0; transform:translate(-50%, -50%) rotate(var(--r)) scale(.3); }
    18% { opacity:1; transform:translate(-50%, -50%) rotate(var(--r)) scale(1.15); }
    70% { opacity:1; transform:translate(-50%, -80%) rotate(var(--r)) scale(1); }
    100% { opacity:0; transform:translate(-50%, -110%) rotate(var(--r)) scale(.95); } }
  .star { position:fixed; z-index:4; pointer-events:none; font-size:20px; color:#FFE08A; text-shadow:0 0 6px #fff;
    animation:star .6s ease-out forwards; }
  @keyframes star { from { transform:translate(-50%, -50%) scale(1); opacity:1; } to { transform:translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(.4); opacity:0; } }

  @media (max-width:760px) { .btn .label { display:none; } .btn.both { width:38px; padding:0; justify-content:center; } }
  @media (max-width:520px) { .btn .label, .chip small, .chip .word { display:none; } .btn.both { width:38px; padding:0; justify-content:center; } .hint { font-size:13px; } }
</style>
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
</script>

<body>
<div class="top">
  <div class="left">
    <div class="brand" id="brand">Stretch<span>y</span></div>
    <nav class="picker" aria-label="Choose a character">
      <a href="?c=stretchy" data-c="stretchy" title="Stretchy"><img src="media/avatar-stretchy.jpg" alt="Stretchy"></a>
      <a href="?c=sarge" data-c="sarge" title="Grumpy Sarge"><img src="media/avatar-sarge.jpg" alt="Grumpy Sarge"></a>
    </nav>
  </div>
  <div class="right">
    <div class="chip" aria-live="polite"><span class="word">Stretch</span> <b id="meter">100%</b><small>best <span id="best">100%</span></small></div>
    <div class="chip" aria-live="polite" title="Slaps">👋 <b id="slaps">0</b></div>
    <button class="btn both" id="both" aria-pressed="false" title="Mirror your pull to the other cheek">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h6M15 12h6M6 9l-3 3 3 3M18 9l3 3-3 3"/></svg>
      <span class="label">Both hands</span>
    </button>
    <button class="btn icon" id="sound" aria-label="Sound on" title="Sound">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4z"/><path id="wave" d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/></svg>
    </button>
  </div>
</div>
<div class="hint" id="hint"></div>

<script type="module">
import * as THREE from 'three';

const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;
const IS_TOUCH = matchMedia('(pointer: coarse)').matches;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const damp = (a, b, k, dt) => a + (b - a) * (1 - Math.exp(-k * dt));

/* ---------- renderer: transparent, the CSS gradient is the wall behind him ---------- */
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x000000, 0);
document.body.prepend(renderer.domElement);
const canvas = renderer.domElement;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(30, innerWidth / innerHeight, 0.1, 50);
camera.position.set(0, 0, 6);

/* ---------- the face: a dense plane that bends where you pull ---------- */
// Every stretchable character: art, where the face is (fractions of the picture), words, colours.
const CHARS = {
  stretchy: {
    name: 'Stretchy', brand: ['Stretch', 'y'], img: 'media/face.jpg', w: 584, h: 888,
    face: { cx: 0.497, cy: 0.55, rx: 0.36, ry: 0.31 }, noseX: 0.497, cheekL: [0.257, 0.47], cheekR: [0.745, 0.47],
    words: ['SLAP!', 'WHAP!', 'SMACK!', 'THWACK!', 'POW!'],
    bg: 'linear-gradient(180deg, #c9b8a4 0%, #c3b09b 50%, #bba893 100%)', accent: '#E2673D',
    edge: [0.14, 0.14, 0.14], smoke: null,
  },
  sarge: {
    name: 'Grumpy Sarge', brand: ['Grumpy ', 'Sarge'], img: 'media/sarge.jpg', w: 540, h: 1126,
    face: { cx: 0.56, cy: 0.55, rx: 0.46, ry: 0.38 }, noseX: 0.60, cheekL: [0.352, 0.405], cheekR: [0.86, 0.405],
    words: ['OI!', 'HMPH!', 'WHAP!', 'SMACK!', 'KIDS THESE DAYS!', 'OUCH!'],
    bg: '#ffffff', accent: '#5E7A2E',
    edge: [0.03, 0.012, 0.03],                 // white paper: a thin fade is enough (the source art is cut at his right ear)
    smoke: [0.965, 0.293],                     // cigarette tip
  },
};
const CHAR_ID = CHARS[new URLSearchParams(location.search).get('c')] ? new URLSearchParams(location.search).get('c') : 'stretchy';
const CH = CHARS[CHAR_ID];
document.title = CH.name;
document.documentElement.style.background = document.body.style.background = CH.bg;
document.documentElement.style.setProperty('--accent', CH.accent);
document.getElementById('brand').innerHTML = `${CH.brand[0]}<span>${CH.brand[1]}</span>`;
document.querySelectorAll('.picker a').forEach(a => { if (a.dataset.c === CHAR_ID) a.setAttribute('aria-current', 'page'); });

const IMG_W = CH.w, IMG_H = CH.h, W = IMG_W / IMG_H, H = 1;   // plane is 1 unit tall
const SLOTS = 4;                                              // up to 4 grabs at once (2 fingers + mirrored copies)
const RADIUS = 0.07;                                          // how much skin one fingertip grabs
const MAX_PULL = 1.25;                                        // stretch limit, in face heights

const tex = new THREE.TextureLoader().load(CH.img, () => {
  ready = true;
  window.ReactNativeWebView?.postMessage(JSON.stringify({ type: 'ready' }));
});
tex.minFilter = THREE.LinearMipmapLinearFilter; tex.anisotropy = 8;

const uniforms = {
  uMap: { value: tex },
  uA: { value: Array.from({ length: SLOTS }, () => new THREE.Vector2()) },   // where each grab started (rest pose)
  uD: { value: Array.from({ length: SLOTS }, () => new THREE.Vector2()) },   // how far it has been pulled
  uR: { value: RADIUS },
  uEdge: { value: new THREE.Vector3(...CH.edge) },                           // edge fade: left, right, top
  uPunch: { value: new THREE.Vector3() },                                    // slap: xy = where, z = push (springs back)
  uHit: { value: Array.from({ length: 3 }, () => new THREE.Vector3()) },    // last 3 slap marks: xy = where, z = redness
};
const faceMat = new THREE.ShaderMaterial({
  uniforms,
  vertexShader: `
    uniform vec2 uA[${SLOTS}]; uniform vec2 uD[${SLOTS}]; uniform float uR; uniform vec3 uPunch;
    varying vec2 vUv; varying float vStretch; varying vec2 vRest;
    void main(){
      vUv = uv; vRest = position.xy;
      vec2 p = position.xy; vec2 off = vec2(0.); float stretch = 0.; float lift = 0.;
      // slap: the cheek that was hit gets shoved sideways; the rest of the head follows (in JS)
      { vec2 rel = p - uPunch.xy; float w = exp(-dot(rel, rel)/(0.17*0.17));
        off += vec2(uPunch.z, -abs(uPunch.z)*.12)*w; lift -= abs(uPunch.z)*w*.4; }
      for (int i = 0; i < ${SLOTS}; i++) {
        vec2 D = uD[i]; float L = length(D);
        if (L < 1e-5) continue;
        vec2 rel = p - uA[i];
        vec2 e = rel*vec2(1., 1.15);
        float w = exp(-dot(e, e)/(uR*uR));                 // skin under the fingertip moves fully, falling off smoothly
        vec2 dir = D/L;
        vec2 perp = rel - dir*dot(rel, dir);
        float thin = w*clamp(L/(uR*3.), 0., 1.)*0.72;      // pull far and the strand gets thin, like taffy
        off += D*w - perp*thin;
        stretch += w*L;
        lift += w*min(L, .6);
      }
      vStretch = stretch;
      gl_Position = projectionMatrix*modelViewMatrix*vec4(p + off, lift*.25, 1.);
    }`,
  fragmentShader: `
    uniform sampler2D uMap; uniform vec3 uHit[3]; uniform vec3 uEdge; varying vec2 vUv; varying float vStretch; varying vec2 vRest;
    void main(){
      vec3 col = texture2D(uMap, vUv).rgb;
      // red handprint where he was slapped: an oval with finger stripes, only on skin (not hair or the wall)
      float red = 0.;
      for (int i = 0; i < 3; i++) {
        vec2 r = (vRest - uHit[i].xy)*vec2(1., .8);
        float hand = smoothstep(.11, .03, length(r))*(.72 + .28*sin(r.x*95.));
        red = max(red, uHit[i].z*hand);
      }
      float skin = smoothstep(.04, .14, col.r - col.b);
      col = mix(col, col*vec3(1.12, .7, .68) + vec3(.07, 0., 0.), clamp(red*skin, 0., 1.)*.85);
      // stretched skin goes a touch pinker and shinier
      float s = clamp(vStretch*1.4, 0., 1.);
      col = mix(col, col*vec3(1.07, .97, .95) + vec3(.035, .02, .02), s*.55);
      // soften the left, right and top edges into the page; the bottom runs off-screen
      float a = smoothstep(0., uEdge.x, vUv.x)*smoothstep(0., uEdge.y, 1. - vUv.x)*smoothstep(0., uEdge.z, 1. - vUv.y);
      gl_FragColor = vec4(col, a);
    }`,
  transparent: true,
});
const face = new THREE.Group(); scene.add(face);
const faceMesh = new THREE.Mesh(new THREE.PlaneGeometry(W, H, 130, 200), faceMat);
face.add(faceMesh);
// flat, invisible copy used only to find where a finger touched the face at rest
const hitPlane = new THREE.Mesh(new THREE.PlaneGeometry(W, H), new THREE.MeshBasicMaterial({ visible: false }));
face.add(hitPlane);

// where his face is inside the picture (face, ears, hair, chin) — grabs only start here
const FACE = { cx: CH.face.cx * W - W / 2, cy: CH.face.cy - 0.5, rx: CH.face.rx * W, ry: CH.face.ry };
const NOSE_X = CH.noseX * W - W / 2;          // "Both hands" mirrors around his nose
const onFace = p => ((p.x - FACE.cx) / FACE.rx) ** 2 + ((p.y - FACE.cy) / FACE.ry) ** 2 <= 1;
const CHEEK_L = new THREE.Vector2(CH.cheekL[0] * W - W / 2, CH.cheekL[1] - 0.5), CHEEK_R = new THREE.Vector2(CH.cheekR[0] * W - W / 2, CH.cheekR[1] - 0.5);

/* ---------- grabs: each is a fingertip (or its mirror) with spring physics ---------- */
const slots = Array.from({ length: SLOTS }, (_, i) => ({
  i, used: false, active: false, pointerId: null, mirror: false,
  A: uniforms.uA.value[i], D: uniforms.uD.value[i], V: new THREE.Vector2(), target: new THREE.Vector2(),
  tip: Object.assign(document.createElement('div'), { className: 'tip' }),
}));
slots.forEach(s => document.body.appendChild(s.tip));
const freeSlot = () => slots.find(s => !s.used);

// rubber resistance: easy at first, harder the further you go, never past MAX_PULL
function resist(v) {
  const L = v.length(); if (L < 1e-6) return v.set(0, 0);
  return v.multiplyScalar(MAX_PULL * Math.tanh(L / MAX_PULL) / L);
}

/* ---------- sound: rubber squeak while pulling, boing on release (WebAudio, no files) ---------- */
let actx = null, soundOn = true, squeak = null;
function audio() {
  if (!actx) {
    try {
      actx = new (window.AudioContext || window.webkitAudioContext)();
      const o = actx.createOscillator(), f = actx.createBiquadFilter(), g = actx.createGain(), lfo = actx.createOscillator(), lg = actx.createGain();
      o.type = 'sawtooth'; f.type = 'bandpass'; f.Q.value = 6; g.gain.value = 0;
      lfo.frequency.value = 7; lg.gain.value = 14; lfo.connect(lg).connect(o.frequency);
      o.connect(f).connect(g).connect(actx.destination); o.start(); lfo.start();
      squeak = { o, f, g };
    } catch (_) { actx = null; }
  }
  if (actx && actx.state === 'suspended') actx.resume();
}
function setSqueak(amount) {
  if (!squeak) return;
  const t = actx.currentTime, on = soundOn && amount > 0.02;
  squeak.o.frequency.setTargetAtTime(150 + amount * 520, t, 0.05);
  squeak.f.frequency.setTargetAtTime(600 + amount * 1800, t, 0.05);
  squeak.g.gain.setTargetAtTime(on ? Math.min(0.05, amount * 0.07) : 0, t, 0.06);
}
function boing(strength) {
  if (!actx || !soundOn || strength < 0.05) return;
  const t = actx.currentTime, o = actx.createOscillator(), g = actx.createGain(), lfo = actx.createOscillator(), lg = actx.createGain();
  const f0 = 260 + strength * 420;
  o.type = 'sine'; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(f0 * 0.45, t + 0.5);
  lfo.frequency.value = 13; lg.gain.setValueAtTime(f0 * 0.18, t); lg.gain.exponentialRampToValueAtTime(1, t + 0.55);
  lfo.connect(lg).connect(o.frequency);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.22, t + 0.012); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.6);
  o.connect(g).connect(actx.destination); o.start(t); lfo.start(t); o.stop(t + 0.65); lfo.stop(t + 0.65);
}
const soundBtn = document.getElementById('sound');
soundBtn.addEventListener('click', () => {
  soundOn = !soundOn; soundBtn.setAttribute('aria-label', soundOn ? 'Sound on' : 'Sound off');
  document.getElementById('wave').style.display = soundOn ? '' : 'none';
  if (!soundOn) setSqueak(0);
});
const bothBtn = document.getElementById('both');
let mirrorMode = false;
if (IS_TOUCH) bothBtn.hidden = true;
bothBtn.addEventListener('click', () => { mirrorMode = !mirrorMode; bothBtn.setAttribute('aria-pressed', String(mirrorMode)); });

/* ---------- input: every pointer (finger or mouse) can grab its own bit of face ---------- */
const raycaster = new THREE.Raycaster(), ndc = new THREE.Vector2(), tmp3 = new THREE.Vector3();
function toFace(clientX, clientY) {                 // screen → face-plane coords (rest pose)
  ndc.set(clientX / innerWidth * 2 - 1, -(clientY / innerHeight) * 2 + 1);
  raycaster.setFromCamera(ndc, camera);
  // intersect the infinite plane so drags keep working far outside the picture
  const plane = new THREE.Plane(new THREE.Vector3(0, 0, 1).applyQuaternion(face.quaternion), 0).translate(face.position);
  const hit = raycaster.ray.intersectPlane(plane, tmp3);
  if (!hit) return null;
  face.worldToLocal(hit);
  return new THREE.Vector2(hit.x, hit.y);
}

let demo = null, hintHidden = false, jiggle = 0;
function grab(e) {
  const p = toFace(e.clientX, e.clientY);
  if (!p || !onFace(p)) return;
  audio();
  demo = null;                                      // any real touch ends the intro demo
  const s = freeSlot(); if (!s) return;
  Object.assign(s, { used: true, active: true, pointerId: e.pointerId, mirror: false, downT: performance.now() });
  s.A.copy(p); s.D.set(0, 0); s.V.set(0, 0); s.target.set(0, 0);
  // desktop "Both hands": a mirrored grab on the other cheek
  if (mirrorMode && !IS_TOUCH) {
    const m = freeSlot();
    if (m) { Object.assign(m, { used: true, active: true, pointerId: e.pointerId, mirror: true }); m.A.set(2 * NOSE_X - p.x, p.y); m.D.set(0, 0); m.V.set(0, 0); m.target.set(0, 0); }
  }
  try { canvas.setPointerCapture(e.pointerId); } catch (_) {}
  canvas.classList.add('grabbing');
  if (!hintHidden) { hintHidden = true; hintEl.classList.add('hide'); }
}
function move(e) {
  const mine = slots.filter(s => s.active && s.pointerId === e.pointerId);
  if (!mine.length) {                               // hover: show a grab cursor over the face
    if (e.pointerType === 'mouse') { const p = toFace(e.clientX, e.clientY); canvas.classList.toggle('grab', !!p && onFace(p)); }
    return;
  }
  const p = toFace(e.clientX, e.clientY); if (!p) return;
  for (const s of mine) {
    const src = mine.find(x => !x.mirror) ?? s;
    const raw = new THREE.Vector2().subVectors(p, src.A);
    if (s.mirror) raw.x = -raw.x;
    s.target.copy(resist(raw));
  }
}
function release(e) {
  const mine = slots.filter(s => s.active && s.pointerId === e.pointerId);
  const main = mine.find(s => !s.mirror);
  if (main) {
    // a quick tap is a slap; so is a fast swipe. Holding and dragging is a stretch.
    const held = performance.now() - main.downT, pulled = main.target.length();
    const tap = held < 230 && pulled < 0.035, swipe = held < 320 && pulled > 0.09;
    if (tap || swipe) {
      const dir = swipe ? Math.sign(main.target.x || 1) : (main.A.x < NOSE_X ? 1 : -1);
      for (const s of mine) { s.active = false; s.D.set(0, 0); s.V.set(0, 0); }
      slap(main.A, dir, swipe ? Math.min(1, pulled * 2.5) : 0.6, e.clientX, e.clientY);
      canvas.classList.remove('grabbing');
      return;
    }
  }
  for (const s of mine) {
    s.active = false;
    const L = s.D.length();
    if (!s.mirror) { boing(L); jiggle = Math.min(1, jiggle + L * 1.2); if (L > 0.15) buzz(18, 'release'); }
  }
  canvas.classList.remove('grabbing');
}

// Phone buzz. Inside the Stretchy app the native side plays a real haptic; on the web, navigator.vibrate
// (browsers only allow it after a real touch, so check first to keep the console clean).
const buzz = (ms, kind) => {
  if (window.ReactNativeWebView) { window.ReactNativeWebView.postMessage(JSON.stringify({ type: 'haptic', kind })); return; }
  if (navigator.vibrate && navigator.userActivation?.hasBeenActive) navigator.vibrate(ms);
};

/* ---------- slap: head jolts away, red handprint, comic popup, crack sound, screen shake ---------- */
const punch = { x: 0, y: 0, P: 0, V: 0 };
let hitIndex = 0, slapCount = 0, shake = 0;
const slapsEl = document.getElementById('slaps');
const WORDS = CH.words;
function slap(at, dir, strength, sx, sy) {
  punch.x = at.x; punch.y = at.y;
  punch.V += dir * (3.2 + strength * 4.5);
  const h = uniforms.uHit.value[hitIndex++ % 3]; h.set(at.x, at.y, 0.7 + strength * 0.3);
  jiggle = Math.min(1, jiggle + 0.5 + strength * 0.4);
  shake = REDUCED ? 0 : 0.6 + strength * 0.6;
  slapCount += 1; slapsEl.textContent = slapCount;
  slapSound(strength);
  buzz(30, 'slap');
  if (!hintHidden) { hintHidden = true; hintEl.classList.add('hide'); }
  if (REDUCED) return;
  const pow = document.createElement('div');
  pow.className = 'pow'; pow.textContent = WORDS[Math.floor(Math.random() * WORDS.length)];
  pow.style.left = sx - dir * 40 + 'px'; pow.style.top = sy - 30 + 'px'; pow.style.setProperty('--r', (Math.random() * 30 - 15) + 'deg');
  document.body.appendChild(pow); setTimeout(() => pow.remove(), 800);
  for (let i = 0; i < 6; i++) {
    const st = document.createElement('div'); st.className = 'star'; st.textContent = '✦';
    const a = Math.random() * Math.PI * 2, d = 50 + Math.random() * 50;
    st.style.left = sx + 'px'; st.style.top = sy + 'px';
    st.style.setProperty('--dx', Math.cos(a) * d + 'px'); st.style.setProperty('--dy', Math.sin(a) * d + 'px');
    document.body.appendChild(st); setTimeout(() => st.remove(), 650);
  }
}
let noiseBuf = null;
function slapSound(strength) {
  if (!actx || !soundOn) return;
  const t = actx.currentTime;
  if (!noiseBuf) { noiseBuf = actx.createBuffer(1, actx.sampleRate * 0.3, actx.sampleRate); const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; }
  // the crack: a bright noise burst
  const n = actx.createBufferSource(), hp = actx.createBiquadFilter(), g = actx.createGain();
  n.buffer = noiseBuf; hp.type = 'highpass'; hp.frequency.value = 900;
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.5 + strength * 0.3, t + 0.003); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.14);
  n.connect(hp).connect(g).connect(actx.destination); n.start(t); n.stop(t + 0.2);
  // the thump underneath
  const o = actx.createOscillator(), og = actx.createGain();
  o.frequency.setValueAtTime(170, t); o.frequency.exponentialRampToValueAtTime(60, t + 0.12);
  og.gain.setValueAtTime(0.0001, t); og.gain.exponentialRampToValueAtTime(0.35, t + 0.005); og.gain.exponentialRampToValueAtTime(0.0001, t + 0.16);
  o.connect(og).connect(actx.destination); o.start(t); o.stop(t + 0.2);
}
canvas.addEventListener('pointerdown', grab);
canvas.addEventListener('pointermove', move);
canvas.addEventListener('pointerup', release);
canvas.addEventListener('pointercancel', release);
canvas.addEventListener('lostpointercapture', release);

/* ---------- cigarette smoke (Sarge) ---------- */
const puffs = [];
if (CH.smoke && !REDUCED) {
  const tip = new THREE.Vector2(CH.smoke[0] * W - W / 2, CH.smoke[1] - 0.5);
  const smokeTex = (() => {
    const c = document.createElement('canvas'); c.width = c.height = 64; const g = c.getContext('2d');
    const gr = g.createRadialGradient(32, 32, 0, 32, 32, 32); gr.addColorStop(0, 'rgba(150,150,155,.55)'); gr.addColorStop(1, 'rgba(150,150,155,0)');
    g.fillStyle = gr; g.fillRect(0, 0, 64, 64); return new THREE.CanvasTexture(c);
  })();
  for (let i = 0; i < 14; i++) {
    const m = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), new THREE.MeshBasicMaterial({ map: smokeTex, transparent: true, depthWrite: false, opacity: 0 }));
    m.position.z = 0.05; m.userData = { age: i / 14 * 4.2, life: 4.2, seed: Math.random() * 10, tip }; face.add(m); puffs.push(m);
  }
}
function updateSmoke(dt, t) {
  for (const m of puffs) {
    const u = m.userData; u.age += dt;
    if (u.age > u.life) { u.age -= u.life; u.seed = Math.random() * 10; }
    const k = u.age / u.life;
    // rise, drift away from his face, curl a little, grow and fade
    m.position.x = u.tip.x + 0.015 + k * 0.1 + Math.sin(t * 1.3 + u.seed + k * 6) * 0.02 * k;
    m.position.y = u.tip.y + 0.01 + k * 0.32 + punch.P * 0.02;
    m.scale.setScalar(0.025 + k * 0.075);
    m.material.opacity = Math.sin(Math.min(1, k * 1.4) * Math.PI) * 0.32 * (1 - k * 0.4);
  }
}

/* ---------- intro: he gets his cheeks pulled once, so people see what to do ---------- */
const hintEl = document.getElementById('hint');
hintEl.textContent = IS_TOUCH ? 'Hold & pull to stretch 👐 · quick tap to slap 👋' : 'Drag his face to stretch · quick click to slap 👋';
let ready = false;
function startDemo() {
  const l = freeSlot(); Object.assign(l, { used: true, active: true, pointerId: -1, mirror: false }); l.A.copy(CHEEK_L);
  const r = freeSlot(); Object.assign(r, { used: true, active: true, pointerId: -1, mirror: true }); r.A.copy(CHEEK_R);
  demo = { t: 0, l, r };
}
function updateDemo(dt) {
  if (!demo) return;
  demo.t += dt;
  const pull = demo.t < 0.9 ? 1 - Math.pow(1 - demo.t / 0.9, 3) : 1;
  const amt = 0.38 * pull;
  demo.l.target.set(-amt, 0.02); demo.r.target.set(amt, 0.02);
  if (demo.t > 1.3) { demo.l.active = demo.r.active = false; jiggle = 0.6; demo = null; }
}

/* ---------- stretch meter ---------- */
const meterEl = document.getElementById('meter'), bestEl = document.getElementById('best');
let best = 100;
try { best = Math.max(100, parseInt(localStorage.getItem(CHAR_ID === 'stretchy' ? 'stretchy-best' : `${CHAR_ID}-best`) || '100', 10) || 100); } catch (_) {}
bestEl.textContent = best + '%';
function updateMeter() {
  // how wide his face is now vs. at rest: total pull across both sides, relative to face width
  let left = 0, right = 0;
  for (const s of slots) if (s.used) { if (s.D.x < 0) left = Math.max(left, -s.D.x); else right = Math.max(right, s.D.x); }
  const pct = Math.round(100 * (1 + (left + right + Math.abs(slots.reduce((m, s) => s.used ? Math.max(m, Math.abs(s.D.y)) : m, 0))) / (FACE.rx * 2)));
  meterEl.textContent = pct + '%';
  if (pct > best && !demo) { best = pct; bestEl.textContent = best + '%'; try { localStorage.setItem(CHAR_ID === 'stretchy' ? 'stretchy-best' : `${CHAR_ID}-best`, String(best)); } catch (_) {} }
  return (left + right) / (FACE.rx * 2);
}

/* ---------- layout: big on any screen, shoulders run off the bottom ---------- */
function layout() {
  renderer.setSize(innerWidth, innerHeight);
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  const visH = 2 * Math.tan(THREE.MathUtils.degToRad(camera.fov / 2)) * camera.position.z, visW = visH * camera.aspect;
  const s = Math.min(visH * 1.0, visW * 1.02 / W);
  face.scale.setScalar(s);
  face.position.set(0, -visH / 2 + s * 0.5 - s * 0.04, 0);     // bottom edge just below the screen
}
addEventListener('resize', layout); layout();

/* ---------- loop ---------- */
const clock = new THREE.Clock();
let demoQueued = false;
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 1 / 30), t = clock.elapsedTime;
  if (ready && !demoQueued) { demoQueued = true; if (!REDUCED) setTimeout(startDemo, 700); }
  updateDemo(dt);

  for (const s of slots) {
    if (!s.used) continue;
    if (s.active) {
      // follow the finger closely (a hair of lag makes it feel like skin, not glass)
      s.V.set(0, 0);
      s.D.x = damp(s.D.x, s.target.x, 28, dt); s.D.y = damp(s.D.y, s.target.y, 28, dt);
    } else if (REDUCED) {
      s.D.set(0, 0);
    } else {
      // released: a bouncy spring back to rest, overshooting a few times
      const k = 160, c = 7.5;
      for (let n = 0; n < 2; n++) {
        const h = dt / 2;
        s.V.x += (-k * s.D.x - c * s.V.x) * h; s.V.y += (-k * s.D.y - c * s.V.y) * h;
        s.D.x += s.V.x * h; s.D.y += s.V.y * h;
      }
    }
    if (!s.active && s.D.lengthSq() < 1e-7 && s.V.lengthSq() < 1e-6) { s.used = false; s.D.set(0, 0); }
    // fingertip marker
    const on = s.used && s.active && s.pointerId !== -1;
    s.tip.classList.toggle('on', on); s.tip.classList.toggle('ghost', s.mirror);
    if (on) {
      tmp3.set(s.A.x + s.D.x, s.A.y + s.D.y, 0); face.localToWorld(tmp3); tmp3.project(camera);
      s.tip.style.left = (tmp3.x * 0.5 + 0.5) * innerWidth + 'px'; s.tip.style.top = (-tmp3.y * 0.5 + 0.5) * innerHeight + 'px';
    }
  }

  const amount = updateMeter();
  setSqueak(slots.some(s => s.active && s.pointerId !== -1) ? amount : 0);

  // head jiggle after a release, plus a gentle idle bob
  jiggle = damp(jiggle, 0, 2.2, dt);
  const j = REDUCED ? 0 : Math.sin(t * 17) * jiggle;
  faceMesh.scale.set(1 + j * 0.035, 1 - j * 0.03, 1);
  // slap spring: the hit cheek shoves over, the head turns and swings back
  for (let n = 0; n < 2; n++) { const h = dt / 2; punch.V += (-260 * punch.P - 11 * punch.V) * h; punch.P += punch.V * h; }
  if (REDUCED) punch.P = punch.V = 0;
  uniforms.uPunch.value.set(punch.x, punch.y, punch.P * 0.28);
  for (const h of uniforms.uHit.value) h.z *= Math.exp(-dt * 0.45);          // handprints fade over a few seconds
  faceMesh.rotation.z = (REDUCED ? 0 : Math.sin(t * 13) * jiggle * 0.03) - punch.P * 0.22;
  faceMesh.position.x = punch.P * 0.07;
  faceMesh.position.y = REDUCED ? 0 : Math.sin(t * 1.3) * 0.004;
  updateSmoke(dt, t);
  shake = damp(shake, 0, 12, dt);
  camera.position.x = (Math.random() - 0.5) * shake * 0.05; camera.position.y = (Math.random() - 0.5) * shake * 0.05;

  renderer.render(scene, camera);
});
</script>
